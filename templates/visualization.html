<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Weather.ai — Visualization</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body
    class="bg-gradient-to-b from-slate-950 via-indigo-950 to-slate-900 text-slate-100 min-h-screen p-6 theme-transition">
    <!-- Animated Background (same look as main) -->
    <div class="fixed inset-0 z-0 opacity-30 theme-transition" id="bgGradient">
        <div
            class="absolute top-20 left-10 w-72 h-72 bg-cyan-500 rounded-full mix-blend-multiply filter blur-3xl animate-pulse">
        </div>
        <div
            class="absolute top-40 right-10 w-72 h-72 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl animate-pulse animation-delay-2000">
        </div>
        <div
            class="absolute -bottom-8 left-20 w-72 h-72 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl animate-pulse animation-delay-4000">
        </div>
    </div>

    <div class="max-w-7xl mx-auto relative z-10">
        <!-- Header Card matching main page style -->
        <div class="mb-6 rounded-2xl overflow-hidden shadow-2xl animate-slide-in">
            <div class="bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 p-1 rounded-2xl">
                <div
                    class="bg-gradient-to-br from-slate-950/95 to-slate-900/95 backdrop-blur-sm p-6 rounded-xl border border-gradient-to-r from-cyan-400/20 to-purple-400/20 theme-transition flex items-center justify-between">
                    <div>
                        <h1
                            class="text-4xl font-bold text-transparent bg-gradient-to-r from-cyan-300 via-blue-300 to-purple-300 bg-clip-text">
                            Weather Analytics — Visualization</h1>
                        <p class="text-sm text-slate-300 mt-1">Interactive charts and KPIs — styled to match main
                            dashboard</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <a href="{{ url_for('dashboard') }}"
                            class="inline-flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-lg shadow hover:scale-105">🏠
                            Back</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main visualization grid (keeps original layout but restyled) -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">
            <div
                class="col-span-1 p-4 rounded-2xl border border-slate-700/30 bg-gradient-to-br from-slate-900/60 to-slate-800/40 shadow-lg">
                <label class="text-sm text-slate-300">Location</label>
                <input id="viz-location"
                    class="w-full mt-3 p-3 rounded-lg bg-slate-800/60 border border-slate-700 text-slate-100"
                    placeholder="Enter city or 'lat,lon'" />
                <div class="mt-3 grid grid-cols-2 gap-2">
                    <select id="viz-units" class="p-2 rounded bg-slate-800 border border-slate-700 text-slate-100">
                        <option value="metric">Celsius</option>
                    </select>
                    <button id="viz-fetch"
                        class="p-2 bg-gradient-to-r from-cyan-500 to-blue-600 rounded-lg text-white font-bold">Refresh</button>
                </div>

                <div class="mt-4 space-y-3">
                    <div class="p-3 bg-slate-800/50 rounded-lg border border-slate-700/30">
                        <div class="text-xs text-slate-400">HCI</div>
                        <div id="viz-hci" class="text-2xl font-bold text-amber-300">--</div>
                    </div>
                    <div class="p-3 bg-slate-800/50 rounded-lg border border-slate-700/30">
                        <div class="text-xs text-slate-400">Temperature</div>
                        <div id="viz-temp" class="text-2xl font-bold text-yellow-300">--</div>
                    </div>
                    <div class="p-3 bg-slate-800/50 rounded-lg border border-slate-700/30">
                        <div class="text-xs text-slate-400">Humidity</div>
                        <div id="viz-hum" class="text-2xl font-bold text-cyan-300">--</div>
                    </div>
                    <div class="p-3 bg-slate-800/50 rounded-lg border border-slate-700/30">
                        <div class="text-xs text-slate-400">AQI (PM2.5)</div>
                        <div id="viz-aqi" class="text-2xl font-bold text-amber-200">--</div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-3 grid grid-cols-1 gap-4">
                <div
                    class="bg-gradient-to-br from-slate-900/60 to-slate-800/50 p-4 rounded-2xl border border-slate-700/30 shadow-lg h-96">
                    <img id="chart-hci" class="w-full h-full object-contain" alt="HCI Chart">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div
                        class="bg-gradient-to-br from-slate-900/60 to-slate-800/50 p-4 rounded-lg border border-slate-700/30 shadow-lg h-80">
                        <img id="chart-temp" class="w-full h-full object-contain" alt="Temperature Chart">
                    </div>
                    <div
                        class="bg-gradient-to-br from-slate-900/60 to-slate-800/50 p-4 rounded-lg border border-slate-700/30 shadow-lg h-80">
                        <img id="chart-humidity" class="w-full h-full object-contain" alt="Humidity Chart">
                    </div>
                    <div
                        class="bg-gradient-to-br from-slate-900/60 to-slate-800/50 p-4 rounded-lg border border-slate-700/30 shadow-lg h-80">
                        <img id="chart-wind" class="w-full h-full object-contain" alt="Wind Chart">
                    </div>
                </div>

                <div
                    class="bg-gradient-to-br from-slate-900/60 to-slate-800/50 p-4 rounded-2xl border border-slate-700/30 shadow-lg h-96">
                    <img id="chart-monthly" class="w-full h-full object-contain" alt="Monthly Chart">
                </div>
            </div>
        </div>

        <script src="{{ url_for('static', filename='visualization.js') }}"></script>
</body>

</html>
